  <script>
    // 화면 너비에 맞춰 1752px 피그마 캔버스 비율 자동 스케일링
    const canvas = document.getElementById('figma-canvas');
    const viewport = document.getElementById('page-viewport');

    function fitCanvas() {
      const scale = Math.min(window.innerWidth / 1752, window.innerHeight / 1264);
      canvas.style.transform = `scale(${scale})`;
      viewport.style.height = `${Math.ceil(1264 * scale)}px`;
    }
    window.addEventListener('resize', fitCanvas);
    fitCanvas();

    // 5초마다 좌우 슬라이드로 넘어가는 배너 캐러셀
    const bannerTrack = document.getElementById('banner-track');
    let currentSlide = 0;

    setInterval(() => {
      currentSlide += 1;
      bannerTrack.style.transition = 'transform 0.75s cubic-bezier(0.25, 1, 0.5, 1)';
      bannerTrack.style.transform = `translateX(-${currentSlide * 1753}px)`;

      // 클론 슬라이드(인덱스 2)에 도달하면 애니메이션 끝난 직후 첫 번째 슬라이드(인덱스 0)로 무음 리셋
      if (currentSlide === 2) {
        setTimeout(() => {
          bannerTrack.style.transition = 'none';
          currentSlide = 0;
          bannerTrack.style.transform = 'translateX(0px)';
        }, 780);
      }
    }, 5000);
  </script>
